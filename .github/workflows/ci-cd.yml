name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image de production
        run: docker build -t metrics-agent:ci .

      - name: Installer les dépendances de test
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx2

      - name: Lancer les tests pytest
        run: pytest

      - name: Connexion à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image (tags latest + SHA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent:${{ github.sha }}
