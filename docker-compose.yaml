services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: metrics-agent:prod
    container_name: metrics-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - metrics-net
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: metrics-agent:prod
    container_name: metrics-agent-collector
    command: ["python", "-m", "app.agent"]
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - metrics-net
    restart: unless-stopped

networks:
  metrics-net:
    driver: bridge
