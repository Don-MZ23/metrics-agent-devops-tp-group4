services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: metrics-agent:prod
    container_name: metrics-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - metrics-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: metrics-agent:prod
    container_name: metrics-agent-worker
    command: ["python", "-m", "app.agent"]
    env_file:
      - .env
    environment:
      METRICS_ENDPOINT: http://api:8000/metrics
    depends_on:
      api:
        condition: service_healthy
    networks:
      - metrics-net

networks:
  metrics-net:
    driver: bridge
